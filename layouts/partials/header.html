<header class="mx-auto flex h-[4.5rem] max-w-(--w) px-8 items-center justify-between">
  <div class="flex items-center">
    <a class="text-2xl font-semibold tracking-tight text-black dark:text-white" href="{{- `` | absURL -}}">{{ site.Title }}</a>
  </div>

  {{- $bg_color := $.Scratch.Get "bg_color" -}}<!---->

  <script>
    // dark theme controller
    const setDark = (isDark) => {
      const htmlClass = document.documentElement.classList;
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      const lightBg = '{{- $bg_color -}}'.replace(/"/g, '');
      if (metaTheme) {
        metaTheme.setAttribute('content', isDark ? "rgb(0 0 0 / 85%)" : lightBg);
      }
      htmlClass[isDark ? 'add' : 'remove']('dark');
      localStorage.setItem('dark', isDark);
    };

    // init theme on load
    (() => {
      const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');
      const darkVal = localStorage.getItem('dark');
      if (darkVal !== null) {
        setDark(darkVal === 'true');
      } else {
        setDark(darkScheme.matches);
      }
      darkScheme.addEventListener('change', (e) => setDark(e.matches));
    })();

    // toggle click listener
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-dark');
      if (btn) {
        const isDark = document.documentElement.classList.contains('dark');
        setDark(!isDark);
      }
    });
  </script>

  <div class="flex items-center gap-6 sm:gap-8">
    {{- with site.Menus.main -}}
    <nav class="site-nav">
      {{- range . -}}
      <a class="text-base font-medium opacity-85 hover:opacity-100 hover:text-accent transition-all" href="{{- .URL | relLangURL -}}">{{- .Name -}}</a>
      {{- end -}}
    </nav>
    {{- end -}}

    <button class="btn-dark p-2 text-neutral-600 hover:text-black dark:text-neutral-300 dark:hover:text-white transition-colors cursor-pointer flex items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10" role="button" aria-label="Toggle Dark Mode" title="Toggle Theme">
      <!-- Sun Icon (visible in Dark Mode) -->
      <svg class="w-5 h-5 hidden dark:block fill-current" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd"/>
      </svg>
      <!-- Moon Icon (visible in Light Mode) -->
      <svg class="w-5 h-5 block dark:hidden fill-current" viewBox="0 0 20 20">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
      </svg>
    </button>
  </div>
</header>
