<header class="site-header">
  <div class="flex items-center">
    <a class="site-logo" href="{{- `` | absURL -}}">{{ site.Title }}</a>
  </div>

  {{- $bg_color := $.Scratch.Get "bg_color" -}}<!---->

  <script>
    // dark theme controller
    (function() {
      function setDark(isDark) {
        var htmlClass = document.documentElement.classList;
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        var lightBg = '{{- $bg_color -}}'.replace(/"/g, '');
        if (metaTheme) {
          metaTheme.setAttribute('content', isDark ? "rgb(0 0 0 / 85%)" : lightBg);
        }
        if (isDark) {
          htmlClass.add('dark');
        } else {
          htmlClass.remove('dark');
        }
        localStorage.setItem('dark', isDark ? 'true' : 'false');
      }

      var stored = localStorage.getItem('dark');
      if (stored !== null) {
        setDark(stored === 'true');
      } else {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        setDark(prefersDark);
      }

      window.addEventListener('click', function(e) {
        var btn = e.target.closest('.btn-dark-toggle');
        if (btn) {
          var isDark = document.documentElement.classList.contains('dark');
          setDark(!isDark);
        }
      });
    })();
  </script>

  <div class="header-right">
    {{- with site.Menus.main -}}
    <nav class="site-nav">
      {{- range . -}}
      <a href="{{- .URL | relLangURL -}}">{{- .Name -}}</a>
      {{- end -}}
    </nav>
    {{- end -}}

    <button class="btn-dark-toggle" role="button" aria-label="Toggle Dark Mode" title="Toggle Theme">
      <!-- Sun Icon (visible in Dark Mode) -->
      <svg class="theme-icon-sun" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd"/>
      </svg>
      <!-- Moon Icon (visible in Light Mode) -->
      <svg class="theme-icon-moon" viewBox="0 0 20 20">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
      </svg>
    </button>
  </div>
</header>
