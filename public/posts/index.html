  <script>
    
    (function() {
      function setDark(isDark) {
        var htmlClass = document.documentElement.classList;
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        var lightBg = '#faf8f1'.replace(/"/g, '');
        if (metaTheme) {
          metaTheme.setAttribute('content', isDark ? "rgb(0 0 0 / 85%)" : lightBg);
        }
        if (isDark) {
          htmlClass.add('dark');
        } else {
          htmlClass.remove('dark');
        }
        localStorage.setItem('dark', isDark ? 'true' : 'false');
      }

      var stored = localStorage.getItem('dark');
      if (stored !== null) {
        setDark(stored === 'true');
      } else {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        setDark(prefersDark);
      }

      window.addEventListener('click', function(e) {
        var btn = e.target.closest('.btn-dark-toggle');
        if (btn) {
          var isDark = document.documentElement.classList.contains('dark');
          setDark(!isDark);
        }
      });
    })();
  </script>
